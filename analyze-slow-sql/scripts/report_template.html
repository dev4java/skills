<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySQL 慢查询分析报告 — {{LOG_FILE}} — {{TIMESTAMP}}</title>
<!-- Chart.js CDN（如无网络则图表区域显示占位提示） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* ── Design Tokens ── */
  :root {
    --blue-1: #0969DA; --blue-5: #EFFAFF;
    --success-1: #00B44B; --success-5: #E8FFEC;
    --error-1: #F24141;  --error-5:   #FFEEEB;
    --warning-1: #FF7F08; --warning-5: #FFF5E5;
    --text-1: #020617; --text-2: #59636E; --text-3: #7F8994; --text-4: #A8B1B8;
    --line-2: #D5D9DE; --line-3: #E1E6EB; --line-4: #EFF2F5;
    --fill-2: #EFF2F5; --fill-4: #F7F8FA; --fill-5: #FFFFFF;
    --nav-bg: #0A0A0A;
    --shadow-1: 0px 2px 6px rgba(0,0,0,.08);
    --shadow-2: 0px 4px 12px rgba(0,0,0,.08);
    --radius: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', 'PingFang SC', 'Source Han Sans CN', 'Hiragino Sans GB',
                 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
    font-size: 14px; line-height: 22px;
    color: var(--text-1); background: var(--fill-4); padding: 24px;
  }
  .page { max-width: 1200px; margin: 0 auto; }

  /* ── 顶部 Banner ── */
  .report-header {
    background: #6590F2;
    color: #fff; border-radius: var(--radius); padding: 28px 32px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .report-header::before {
    content: ''; position: absolute; top: -40%; right: -2%;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 65%);
    pointer-events: none;
  }
  .report-header h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #FFFFFF; }
  .report-header .meta { font-size: 13px; color: rgba(255,255,255,.8); line-height: 20px; }
  .report-header .badge {
    display: inline-block;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35);
    border-radius: 50px; padding: 2px 12px; font-size: 12px; color: #FFFFFF;
  }

  /* ── 卡片 ── */
  .card {
    background: var(--fill-5); border-radius: var(--radius);
    border: 1px solid var(--line-3); box-shadow: var(--shadow-1);
    padding: 20px 24px; margin-bottom: 12px;
  }
  .card > h2 {
    font-size: 14px; font-weight: 600; color: var(--text-1);
    border-left: 3px solid var(--blue-1); padding-left: 10px; margin-bottom: 16px;
  }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 14px 0 8px; }
  .card p  { margin-bottom: 8px; color: var(--text-2); line-height: 22px; }
  .card ol, .card ul { padding-left: 20px; }
  .card li { margin-bottom: 4px; color: var(--text-2); }

  /* ── KPI 指标格 ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .kpi {
    background: var(--fill-4); border: 1px solid var(--line-3);
    border-radius: var(--radius); padding: 14px 16px; text-align: center;
  }
  .kpi .val {
    font-size: 22px; font-weight: 600; color: var(--blue-1); line-height: 26px;
    font-family: Roboto, 'Helvetica Neue', 'PingFang SC', sans-serif;
  }
  .kpi .lbl { font-size: 12px; color: var(--text-2); margin-top: 4px; font-weight: 400; }

  /* ── 图表区域 ── */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .chart-wrap { position: relative; }
  .chart-wrap canvas { max-height: 260px; }
  .chart-label {
    font-size: 12px; font-weight: 500; color: var(--text-3);
    text-align: center; margin-bottom: 8px;
  }
  .chart-full { margin-top: 16px; }
  .chart-full canvas { max-height: 220px; width: 100% !important; }
  .chart-offline {
    display: none; background: var(--fill-4); border: 1px solid var(--line-3);
    border-radius: var(--radius); padding: 20px; text-align: center;
    color: var(--text-4); font-size: 12px;
  }

  /* ── 表格 ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: var(--fill-4); color: var(--text-2); font-weight: 500;
    padding: 10px 12px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--line-3); font-size: 12px;
  }
  td {
    padding: 10px 12px; border-bottom: 1px solid var(--line-4);
    vertical-align: top; color: var(--text-1); line-height: 20px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--fill-4); }
  .num {
    text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-family: Roboto, 'Helvetica Neue', 'PingFang SC', sans-serif;
  }

  /* ── SQL 代码块 ── */
  .sql-block {
    background: #F0F6FC; color: #1E293B; border-radius: var(--radius);
    border: 1px solid #C8DAEA;
    padding: 14px 16px;
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Courier New", monospace;
    font-size: 12.5px; line-height: 1.7; overflow-x: auto; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ── 可折叠 issue-block ── */
  .issue-block .issue-header { cursor: pointer; user-select: none; }
  .issue-block .issue-header .toggle-icon {
    margin-left: auto; font-size: 11px; opacity: .4; flex-shrink: 0;
  }
  .issue-block.collapsed .issue-body { display: none; }

  /* ── Tab 切换 ── */
  .tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--line-3); margin-bottom: 20px; }
  .tab-btn {
    padding: 8px 20px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--text-3); border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--blue-1); }
  .tab-btn.active { color: var(--blue-1); border-bottom-color: var(--blue-1); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── 页脚 ── */
  .footer {
    text-align: center; color: var(--text-4); font-size: 12px;
    margin-top: 28px; padding: 16px 0; border-top: 1px solid var(--line-3);
  }
</style>
</head>
<body>
<div class="page">

{{REPORT_BODY}}

<div class="footer">
  由 Claude AI 生成 · 仅供参考 · 请结合实际情况决策 &nbsp;·&nbsp; {{TOKEN_EST}}
</div>

</div>

<script>
(function() {
  function initChart(canvasId, config) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (typeof Chart === 'undefined') {
      var fb = el.parentNode.querySelector('.chart-offline');
      if (fb) { el.style.display = 'none'; fb.style.display = 'block'; }
      return;
    }
    new Chart(el, config);
  }

  function activateTab(group, tabId) {
    group.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    group.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
    var btn = group.querySelector('[data-tab="' + tabId + '"]');
    var pane = group.querySelector('#' + tabId);
    if (btn) btn.classList.add('active');
    if (pane) pane.classList.add('active');
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      activateTab(btn.closest('.tab-group'), btn.dataset.tab);
    });
  });

  /* 可折叠 issue-block（点击 header 展开/收起） */
  document.querySelectorAll('.issue-block').forEach(function(block) {
    var header = block.querySelector('.issue-header');
    if (!header) return;
    var icon = document.createElement('span');
    icon.className = 'toggle-icon';
    icon.textContent = block.classList.contains('collapsed') ? '▶' : '▼';
    header.appendChild(icon);
    header.addEventListener('click', function() {
      block.classList.toggle('collapsed');
      icon.textContent = block.classList.contains('collapsed') ? '▶' : '▼';
    });
  });

  /* 图表初始化（数据由 report_body 注入 window.CHART_*） */
  initChart('chart-dist', {
    type: 'doughnut',
    data: window.CHART_DIST || { labels: [], datasets: [{ data: [] }] },
    options: { plugins: { legend: { position: 'right' } } }
  });

  initChart('chart-daily', {
    type: 'line',
    data: window.CHART_DAILY || { labels: [], datasets: [] },
    options: { interaction: { mode: 'index', intersect: false } }
  });

  initChart('chart-users', {
    type: 'bar',
    data: window.CHART_USERS || { labels: [], datasets: [] },
    options: { indexAxis: 'y' }
  });

  initChart('chart-schemas', {
    type: 'bar',
    data: window.CHART_SCHEMAS || { labels: [], datasets: [] }
  });
})();
</script>
</body>
</html>
